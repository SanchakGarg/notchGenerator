[project]
name = "notchgen"
version = "0.1.0"
description = "Add bend-relief notches to Fusion 360 sheet-metal flat-pattern DXF exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3.5",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
notchgen = "notchgen.cli:main"
notchgen-web = "notchgen.serve:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notchgen"]
[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
